<svg xmlns="http://www.w3.org/2000/svg" width="560" height="370" viewBox="0 0 560 370" role="img" aria-labelledby="title desc">
  <title id="title">结果交付：模块的结构化结果直接生成报告</title>
  <desc id="desc">模块输出结构化结果，直接用于生成报告并交付</desc>

  <defs>
    <marker id="a-rd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
    <filter id="sh-rd" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .t { font-size: 15px; font-weight: 800; }
      .d { font-size: 11px; fill: #64748b; }
      .lbl { font-size: 10.5px; font-weight: 700; fill: #2563eb; }
    </style>
  </defs>

  <rect width="560" height="370" rx="10" fill="#f8fafc"/>

  <!-- ==================== 模块 ==================== -->
  <g transform="translate(10, 14)">
    <rect width="540" height="86" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh-rd)"/>
    <text x="20" y="40" class="t" fill="#334155">模块</text>
    <text x="20" y="64" class="d">C2R / scLego 等，输出结构化结果</text>
  </g>

  <path d="M 280 102 L 280 126" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-rd)"/>
  <text x="292" y="120" class="lbl">结构化</text>

  <!-- ==================== 结构化结果 ==================== -->
  <g transform="translate(10, 132)">
    <rect width="540" height="86" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" filter="url(#sh-rd)"/>
    <text x="20" y="40" class="t" fill="#1d4ed8">结构化结果</text>
    <text x="20" y="64" class="d">数据 + 分析结果</text>
  </g>

  <path d="M 280 220 L 280 244" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-rd)"/>
  <text x="292" y="238" class="lbl">生成</text>

  <!-- ==================== 报告 ==================== -->
  <g transform="translate(10, 250)">
    <rect width="540" height="106" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#sh-rd)"/>
    <text x="20" y="42" class="t" fill="#c2410c">报告</text>
    <text x="20" y="66" class="d">自动生成，可直接交付</text>
  </g>
</svg>
