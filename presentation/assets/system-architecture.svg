<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" role="img" aria-labelledby="title desc">
  <title id="title">系统结构：界面层与后端服务的概念组成</title>
  <desc id="desc">界面层只发出请求；后端服务由绘图智能体、文本智能体、统一的数据结构与唯一的输出结构构成</desc>

  <defs>
    <marker id="a-arch" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <filter id="sh-arch" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .h1 { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .h2 { font-size: 13px; fill: #64748b; }
      .card-t { font-size: 17px; font-weight: 700; }
      .sub-t { font-size: 15px; font-weight: 700; }
      .item { font-size: 13.5px; fill: #334155; }
      .step { font-size: 12.5px; font-weight: 600; }
      .row-t { font-size: 15px; font-weight: 800; }
      .row-d { font-size: 12.5px; fill: #475569; }
      .arrow-l { font-size: 12px; font-weight: 700; fill: #2563eb; }
      .note-l { font-size: 13px; font-weight: 700; fill: #1e40af; }
      .note-d { font-size: 13px; fill: #334155; }
    </style>
  </defs>

  <rect width="1280" height="670" rx="16" fill="#f8fafc"/>

  <text x="40" y="44" class="h1">系统结构</text>
  <text x="40" y="68" class="h2">界面层只发出请求；后端服务由两个智能体与两类结构构成</text>

  <!-- ==================== 界面层 ==================== -->
  <g transform="translate(40, 110)">
    <rect width="250" height="440" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh-arch)"/>
    <rect width="250" height="46" rx="12" fill="#eff6ff"/>
    <rect y="30" width="250" height="16" fill="#eff6ff"/>
    <text x="22" y="30" class="card-t" fill="#1d4ed8">界面层</text>

    <text x="24" y="150" class="item">四个界面</text>
    <text x="24" y="210" class="item">展示与交互</text>
    <text x="24" y="270" class="item">不持有模型与数据</text>

    <line x1="24" y1="310" x2="226" y2="310" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="24" y="350" class="item" fill="#64748b">只向后端发出请求</text>
  </g>

  <!-- ==================== 后端服务 ==================== -->
  <g transform="translate(340, 110)">
    <rect width="900" height="440" rx="12" fill="#ffffff" stroke="#c084fc" stroke-width="1.8" filter="url(#sh-arch)"/>
    <rect width="900" height="46" rx="12" fill="#faf5ff"/>
    <rect y="30" width="900" height="16" fill="#faf5ff"/>
    <text x="22" y="30" class="card-t" fill="#7e22ce">后端服务</text>

    <!-- 绘图智能体 -->
    <g transform="translate(24, 62)">
      <rect width="852" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
      <text x="18" y="28" class="sub-t" fill="#334155">绘图智能体</text>
      <text x="140" y="28" font-size="11.5" fill="#64748b">四个界面共享</text>

      <rect x="18" y="40" width="153" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="30" y="73" class="step" fill="#334155">理解意图</text>

      <rect x="183" y="40" width="153" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="195" y="73" class="step" fill="#334155">选择数据</text>

      <rect x="348" y="40" width="153" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="360" y="73" class="step" fill="#334155">规划绘图</text>

      <rect x="513" y="40" width="153" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="525" y="73" class="step" fill="#334155">生成并修复代码</text>

      <rect x="678" y="40" width="153" height="56" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="690" y="73" class="step" fill="#334155">产出图版本</text>
    </g>

    <!-- 文本智能体 -->
    <g transform="translate(24, 186)">
      <rect width="852" height="112" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.4"/>
      <text x="18" y="28" class="sub-t" fill="#7e22ce">文本智能体</text>
      <text x="140" y="28" font-size="11.5" fill="#64748b">仅 Report 与 Slides 使用</text>

      <rect x="18" y="40" width="195" height="56" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="30" y="73" class="step" fill="#6b21a8">理解写作请求</text>

      <rect x="225" y="40" width="195" height="56" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="237" y="73" class="step" fill="#6b21a8">生成正文</text>

      <rect x="432" y="40" width="195" height="56" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="444" y="73" class="step" fill="#6b21a8">生成要点与图注</text>

      <rect x="639" y="40" width="195" height="56" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="651" y="73" class="step" fill="#6b21a8">组织章节与页面</text>
    </g>

    <!-- 两类结构 -->
    <g transform="translate(24, 310)">
      <rect width="414" height="110" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
      <text x="20" y="38" class="row-t" fill="#1d4ed8">统一的数据结构</text>
      <text x="20" y="70" class="row-d">三类数据统一建模</text>
      <text x="20" y="94" class="row-d">数据 / 数据集 / 分析结果</text>
    </g>

    <g transform="translate(462, 310)">
      <rect width="414" height="110" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.4"/>
      <text x="20" y="38" class="row-t" fill="#047857">唯一的输出结构</text>
      <text x="20" y="70" class="row-d">两个智能体产出同一种结构</text>
      <text x="20" y="94" class="row-d">任意界面均可直接消费</text>
    </g>
  </g>

  <!-- ==================== 箭头 ==================== -->
  <path d="M 294 330 L 336 330" stroke="#2563eb" stroke-width="2.4" marker-end="url(#a-arch)"/>
  <text x="286" y="314" class="arrow-l">接口</text>

  <!-- ==================== 边界规则 ==================== -->
  <g transform="translate(40, 576)">
    <rect width="1200" height="64" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="24" y="38" class="note-l">边界规则</text>
    <text x="118" y="38" class="note-d">界面不直接访问模型、数据与执行环境；原始数据只留在后端，模型仅接收精简画像。</text>
  </g>
</svg>
