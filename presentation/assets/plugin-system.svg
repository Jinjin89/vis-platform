<svg xmlns="http://www.w3.org/2000/svg" width="560" height="370" viewBox="0 0 560 370" role="img" aria-labelledby="title desc">
  <title id="title">插件化：四个界面作为 C2R 平台的插件</title>
  <desc id="desc">四个界面可作为插件接入 C2R 平台，官方提供最佳实践，用户也可以贡献插件</desc>

  <defs>
    <marker id="a-pl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
    <filter id="sh-pl" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .pl-t { font-size: 15px; font-weight: 800; fill: #0f172a; }
      .pl-d { font-size: 10.5px; fill: #94a3b8; }
      .src-t { font-size: 13px; font-weight: 800; }
      .src-d { font-size: 10.5px; fill: #475569; }
      .plat { font-size: 17px; font-weight: 800; fill: #334155; }
      .lbl { font-size: 10.5px; font-weight: 700; fill: #2563eb; }
    </style>
  </defs>

  <rect width="560" height="370" rx="10" fill="#f8fafc"/>

  <!-- ==================== 插件层：四个界面 ==================== -->
  <g transform="translate(10, 12)">
    <rect width="250" height="76" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4" filter="url(#sh-pl)"/>
    <text x="125" y="36" class="pl-t" text-anchor="middle">Workspace</text>
    <text x="125" y="58" class="pl-d" text-anchor="middle">插件</text>
  </g>

  <g transform="translate(300, 12)">
    <rect width="250" height="76" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.4" filter="url(#sh-pl)"/>
    <text x="125" y="36" class="pl-t" text-anchor="middle">Canvas</text>
    <text x="125" y="58" class="pl-d" text-anchor="middle">插件</text>
  </g>

  <g transform="translate(10, 100)">
    <rect width="250" height="76" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.4" filter="url(#sh-pl)"/>
    <text x="125" y="36" class="pl-t" text-anchor="middle">Report</text>
    <text x="125" y="58" class="pl-d" text-anchor="middle">插件</text>
  </g>

  <g transform="translate(300, 100)">
    <rect width="250" height="76" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.4" filter="url(#sh-pl)"/>
    <text x="125" y="36" class="pl-t" text-anchor="middle">Slides</text>
    <text x="125" y="58" class="pl-d" text-anchor="middle">插件</text>
  </g>

  <!-- ==================== 插件来源 ==================== -->
  <g transform="translate(10, 188)">
    <rect width="250" height="66" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.4" filter="url(#sh-pl)"/>
    <text x="16" y="30" class="src-t" fill="#047857">官方最佳实践</text>
    <text x="16" y="50" class="src-d">保证质量基线</text>
  </g>

  <g transform="translate(300, 188)">
    <rect width="250" height="66" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.4" filter="url(#sh-pl)"/>
    <text x="16" y="30" class="src-t" fill="#7e22ce">用户插件</text>
    <text x="16" y="50" class="src-d">用户参与平台</text>
  </g>

  <!-- ==================== 接入平台 ==================== -->
  <path d="M 280 256 L 280 278" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-pl)"/>
  <text x="292" y="272" class="lbl">插件接口</text>

  <g transform="translate(10, 284)">
    <rect width="540" height="68" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh-pl)"/>
    <text x="270" y="42" class="plat" text-anchor="middle">C2R 平台</text>
  </g>
</svg>
