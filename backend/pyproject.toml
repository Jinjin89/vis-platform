[project]
name = "vis-platform-backend"
version = "0.1.0"
description = "Backend API and orchestration for Vis Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cairosvg>=2.8,<3",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.27,<1",
    "numpy>=2.2,<3",
    "pillow>=12,<13",
    "pyarrow>=21,<25",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pypdf>=6,<7",
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vis_platform_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vis_platform_backend"]

# pyarrow's bundled type information is partial (compute and CSV functions are generated at
# import time), so it is treated as untyped.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
follow_imports = "skip"
follow_untyped_imports = true
