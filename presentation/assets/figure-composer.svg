<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="190" viewBox="0 0 1240 190" role="img" aria-labelledby="title desc">
  <title id="title">尚未实现的第 5 个界面：组图</title>
  <desc id="desc">由文本驱动的智能体自动从已有结果中选图，按 A4 等版面尺寸编排成组图，之后仍可由绘图智能体继续修改</desc>

  <defs>
    <marker id="a-fc" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7.5 4.5 L1 8" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
    <filter id="sh-fc" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .box-t { font-size: 15px; font-weight: 800; fill: #0f172a; }
      .box-d { font-size: 11px; fill: #64748b; }
      .panel { font-size: 11px; font-weight: 700; fill: #b45309; }
      .step { font-size: 10.5px; font-weight: 700; fill: #2563eb; }
      .new { font-size: 10.5px; font-weight: 700; fill: #c2410c; }
    </style>
  </defs>

  <rect width="1240" height="190" rx="12" fill="#f8fafc"/>

  <!-- ==================== 已有图像 ==================== -->
  <g transform="translate(20, 20)">
    <rect width="240" height="150" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh-fc)"/>
    <text x="18" y="34" class="box-t" fill="#1d4ed8">已有图像</text>
    <text x="18" y="56" class="box-d">来自绘图智能体的结果</text>

    <rect x="16" y="72" width="64" height="58" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="90" y="72" width="64" height="58" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="164" y="72" width="64" height="58" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  </g>

  <!-- ==================== 自动选图 ==================== -->
  <path d="M 268 100 L 372 100" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-fc)"/>
  <text x="320" y="82" class="step" text-anchor="middle">文本驱动</text>
  <text x="320" y="96" class="step" text-anchor="middle">Agent 自动选图</text>

  <!-- ==================== 组图界面 ==================== -->
  <g transform="translate(380, 20)">
    <rect width="460" height="150" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8" filter="url(#sh-fc)"/>
    <text x="18" y="34" class="box-t" fill="#c2410c">组图界面</text>
    <text x="18" y="56" class="box-d">按 A4 等版面尺寸编排</text>
    <text x="18" y="78" class="new">第 5 个界面，尚未实现</text>

    <!-- A4 版面示意 -->
    <rect x="250" y="30" width="190" height="100" rx="4" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
    <rect x="258" y="38" width="84" height="40" rx="3" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="294" y="62" class="panel">A</text>
    <rect x="348" y="38" width="84" height="40" rx="3" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="384" y="62" class="panel">B</text>
    <rect x="258" y="84" width="174" height="38" rx="3" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="339" y="107" class="panel">C</text>
  </g>

  <!-- ==================== 继续修改 ==================== -->
  <path d="M 848 100 L 952 100" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-fc)"/>
  <text x="900" y="88" class="step" text-anchor="middle">继续修改</text>

  <!-- ==================== 绘图智能体 ==================== -->
  <g transform="translate(960, 20)">
    <rect width="260" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh-fc)"/>
    <text x="18" y="70" class="box-t" fill="#334155">绘图智能体</text>
    <text x="18" y="94" class="box-d">组图仍可继续修改</text>
  </g>
</svg>
