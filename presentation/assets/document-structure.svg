<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">报告与幻灯片的结构化文档数据</title>
  <desc id="desc">报告按章节组织内容块，幻灯片按页组织同一套内容块，图表块以指针绑定图版本</desc>

  <defs>
    <filter id="sh-doc" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .h1 { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .h2 { font-size: 13px; fill: #64748b; }
      .card-t { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .field { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; font-weight: 700; }
      .gloss { font-size: 12.5px; fill: #475569; }
      .note { font-size: 12px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="16" fill="#f8fafc"/>

  <text x="40" y="44" class="h1">报告与幻灯片：另一套结构化文档数据</text>
  <text x="40" y="68" class="h2">两者复用同一套内容块，差别只在组织方式：报告按章节，幻灯片按页</text>

  <!-- ==================== 左：报告结构 ==================== -->
  <g transform="translate(40, 95)">
    <rect width="590" height="330" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="1.5" filter="url(#sh-doc)"/>
    <rect width="590" height="34" rx="12" fill="#fff7ed"/>
    <rect y="20" width="590" height="14" fill="#fff7ed"/>
    <text x="20" y="23" class="card-t" fill="#c2410c">Report 结构</text>

    <text x="26" y="74" class="field" fill="#c2410c">ReportContent</text>
    <text x="200" y="74" class="gloss">标题与引用的数据集</text>

    <text x="46" y="108" class="field" fill="#9a3412">sections[]</text>
    <text x="200" y="108" class="gloss">章节，支持两级与父子关系</text>

    <text x="66" y="142" class="field" fill="#9a3412">blocks[]</text>
    <text x="200" y="142" class="gloss">章节内的内容块序列</text>

    <text x="86" y="176" class="field" fill="#ea580c">text</text>
    <text x="200" y="176" class="gloss">正文段落</text>

    <text x="86" y="208" class="field" fill="#ea580c">figure</text>
    <text x="200" y="208" class="gloss">图表，以指针绑定图版本</text>

    <text x="86" y="240" class="field" fill="#ea580c">table</text>
    <text x="200" y="240" class="gloss">表格，列定义与行数据</text>

    <text x="26" y="292" class="note">正文块可携带证据版本引用，说明该结论依据哪一版图表得出。</text>
  </g>

  <!-- ==================== 右：幻灯片结构 ==================== -->
  <g transform="translate(650, 95)">
    <rect width="590" height="330" rx="12" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" filter="url(#sh-doc)"/>
    <rect width="590" height="34" rx="12" fill="#faf5ff"/>
    <rect y="20" width="590" height="14" fill="#faf5ff"/>
    <text x="20" y="23" class="card-t" fill="#7e22ce">Slides 结构</text>

    <text x="26" y="74" class="field" fill="#7e22ce">SlideDeckContent</text>
    <text x="220" y="74" class="gloss">标题、数据集与演示设置</text>

    <text x="46" y="108" class="field" fill="#6b21a8">slides[]</text>
    <text x="220" y="108" class="gloss">幻灯片页序列</text>

    <text x="66" y="142" class="field" fill="#6b21a8">title / settings</text>
    <text x="220" y="142" class="gloss">页标题与版式设置</text>

    <text x="66" y="176" class="field" fill="#6b21a8">elements[]</text>
    <text x="220" y="176" class="gloss">页内元素，复用同一套内容块</text>

    <text x="86" y="208" class="field" fill="#9333ea">text / figure / table</text>
    <text x="290" y="208" class="gloss">与报告完全一致</text>

    <text x="26" y="292" class="note">每页是一个版式卡槽，图表元素与报告共用同一个块类型。</text>
  </g>

  <!-- ==================== 底：图表块的两种绑定 ==================== -->
  <g transform="translate(40, 450)">
    <rect width="1200" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" filter="url(#sh-doc)"/>
    <text x="22" y="32" font-size="13" font-weight="800" fill="#334155">图表块的两种绑定方式</text>

    <text x="22" y="60" class="field" fill="#ea580c">version_id</text>
    <text x="130" y="60" class="gloss">锁定到某个不可变版本，后续修改不影响成稿</text>

    <text x="620" y="60" class="field" fill="#ea580c">follow_plot_id</text>
    <text x="760" y="60" class="gloss">跟随该图的最新版本，自动同步上游修改</text>
  </g>
</svg>
