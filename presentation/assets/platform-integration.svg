<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">平台接入契约与试点路线</title>
  <desc id="desc">标准契约接入边界与三步试点路线</desc>

  <defs>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <filter id="sh4" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .h1 { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .h2 { font-size: 13px; fill: #64748b; }
      .ct { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .badge { font-size: 12px; font-weight: 700; }
      .txt { font-size: 12.5px; fill: #334155; }
    </style>
  </defs>

  <rect width="1280" height="460" rx="16" fill="#f8fafc"/>

  <!-- 顶部标题 -->
  <text x="40" y="44" class="h1">平台接入契约与试点路线</text>
  <text x="40" y="68" class="h2">不改动平台底层库，以标准契约接入，单点闭环验证</text>

  <!-- ==================== 上半区：适配层数据契约 ==================== -->
  <g transform="translate(40, 92)">
    <rect width="1200" height="145" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.6" filter="url(#sh4)"/>
    <rect width="1200" height="32" rx="12" fill="#eff6ff"/>
    <rect y="20" width="1200" height="12" fill="#eff6ff"/>
    <text x="20" y="22" font-size="14" font-weight="800" fill="#1e40af">标准适配契约边界 (Source Contract)</text>

    <!-- 1. 现有分析平台 -->
    <g transform="translate(24, 46)">
      <rect width="210" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="14" y="30" class="ct" fill="#334155">现有分析平台</text>
      <text x="14" y="56" class="txt">业务库保持不变</text>
      <text x="14" y="74" class="txt">暴露对象读取 API</text>
    </g>

    <!-- 2. Source Contract 适配层 -->
    <g transform="translate(288, 46)">
      <rect width="250" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
      <text x="14" y="30" class="ct" fill="#1d4ed8">Source Contract</text>
      <text x="14" y="56" class="txt">归一化数据集描述</text>
      <text x="14" y="74" class="txt">提取 Agent 精简画像</text>
    </g>

    <!-- 3. Vis Platform -->
    <g transform="translate(592, 46)">
      <rect width="260" height="82" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.4"/>
      <text x="14" y="30" class="ct" fill="#047857">Vis Platform 绘图引擎</text>
      <text x="14" y="56" class="txt">Workspace 交互出图</text>
      <text x="14" y="74" class="txt">矢量 SVG / 300 DPI 导出</text>
    </g>

    <!-- 4. 成果回写平台 -->
    <g transform="translate(906, 46)">
      <rect width="270" height="82" rx="8" fill="#fffaf5" stroke="#fed7aa" stroke-width="1.4"/>
      <text x="14" y="30" class="ct" fill="#c2410c">成果与元数据回传</text>
      <text x="14" y="56" class="txt">高清图回写平台存储</text>
      <text x="14" y="74" class="txt">附带 R 源码与可复现指纹</text>
    </g>

    <!-- 箭头 -->
    <path d="M 234 87 L 288 87" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr4)"/>
    <path d="M 538 87 L 592 87" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr4)"/>
    <path d="M 852 87 L 906 87" stroke="#059669" stroke-width="2.2" marker-end="url(#arr4)"/>
  </g>

  <!-- ==================== 下半区：落地三步走 ==================== -->
  <g transform="translate(40, 262)">
    <rect width="1200" height="158" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6" filter="url(#sh4)"/>
    <rect width="1200" height="32" rx="12" fill="#fff7ed"/>
    <rect y="20" width="1200" height="12" fill="#fff7ed"/>
    <text x="20" y="22" font-size="14" font-weight="800" fill="#c2410c">渐进式试点落地路线 (3-Step Pilot Roadmap)</text>

    <!-- Step 1 -->
    <g transform="translate(24, 48)">
      <rect width="360" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="28" class="badge" fill="#2563eb">STEP 1 - 选定单点突破口</text>
      <text x="14" y="56" class="ct" font-size="15">选定高频分析模块</text>
      <text x="14" y="80" class="txt">对齐对象 schema 与读取接口</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(414, 48)">
      <rect width="360" height="92" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="14" y="28" class="badge" fill="#1d4ed8">STEP 2 - 打通单图闭环</text>
      <text x="14" y="56" class="ct" font-size="15">结果旁增加作图入口</text>
      <text x="14" y="80" class="txt">调起 Workspace 完成精修</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(804, 48)">
      <rect width="372" height="92" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="14" y="28" class="badge" fill="#047857">STEP 3 - 闭环回传与扩展</text>
      <text x="14" y="56" class="ct" font-size="15">资产回写与按需延伸</text>
      <text x="14" y="80" class="txt">回传图表与可复现指纹</text>
    </g>
  </g>
</svg>
