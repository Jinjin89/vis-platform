<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">一次请求的执行路径</title>
  <desc id="desc">统一管线：意图、数据、绘图、受限沙箱、不可变版本</desc>

  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <filter id="sh2" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .h1 { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .h2 { font-size: 13px; fill: #64748b; }
      .step-num { font-size: 12px; font-weight: 800; }
      .step-t { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .tag { font-size: 12px; font-weight: 700; }
      .desc { font-size: 12.5px; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="16" fill="#f8fafc"/>

  <!-- 顶部标题 -->
  <text x="40" y="44" class="h1">一次请求的执行路径</text>
  <text x="40" y="68" class="h2">统一后端管线：意图 -&gt; 数据 -&gt; 绘图 -&gt; 受限沙箱 -&gt; 不可变版本</text>

  <!-- 1. 统一入口 -->
  <g transform="translate(40, 100)">
    <rect width="170" height="185" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh2)"/>
    <rect width="170" height="30" rx="10" fill="#eff6ff"/>
    <rect y="20" width="170" height="10" fill="#eff6ff"/>
    <text x="14" y="21" class="step-num" fill="#1d4ed8">STEP 01</text>
    <text x="14" y="62" class="step-t">统一请求入口</text>
    <text x="14" y="94" class="desc">自然语言或面板微调</text>
    <text x="14" y="118" class="desc">四界面共用同一管线</text>
    <rect x="12" y="132" width="146" height="40" rx="6" fill="#f1f5f9"/>
    <text x="22" y="157" class="tag" fill="#475569">无孤岛后端</text>
  </g>

  <!-- 2. 意图 Agent -->
  <g transform="translate(245, 100)">
    <rect width="170" height="185" rx="10" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" filter="url(#sh2)"/>
    <rect width="170" height="30" rx="10" fill="#faf5ff"/>
    <rect y="20" width="170" height="10" fill="#faf5ff"/>
    <text x="14" y="21" class="step-num" fill="#7e22ce">STEP 02</text>
    <text x="14" y="62" class="step-t">意图 Agent</text>
    <text x="14" y="94" class="desc">拆解作图目标</text>
    <text x="14" y="118" class="desc">评估执行就绪度</text>
    <rect x="12" y="132" width="146" height="40" rx="6" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="22" y="157" class="tag" fill="#7e22ce">歧义主动澄清</text>
  </g>

  <!-- 3. 数据 Agent -->
  <g transform="translate(450, 100)">
    <rect width="170" height="185" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh2)"/>
    <rect width="170" height="30" rx="10" fill="#eff6ff"/>
    <rect y="20" width="170" height="10" fill="#eff6ff"/>
    <text x="14" y="21" class="step-num" fill="#1d4ed8">STEP 03</text>
    <text x="14" y="62" class="step-t">数据 Agent</text>
    <text x="14" y="94" class="desc">检索数据与画像</text>
    <text x="14" y="118" class="desc">检查分析结果</text>
    <rect x="12" y="132" width="146" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="22" y="157" class="tag" fill="#1d4ed8">命中缓存直通</text>
  </g>

  <!-- 4. 绘图 Agent -->
  <g transform="translate(655, 100)">
    <rect width="170" height="185" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#sh2)"/>
    <rect width="170" height="30" rx="10" fill="#fefce8"/>
    <rect y="20" width="170" height="10" fill="#fefce8"/>
    <text x="14" y="21" class="step-num" fill="#b45309">STEP 04</text>
    <text x="14" y="62" class="step-t">绘图 Agent</text>
    <text x="14" y="94" class="desc">规划标准 R 脚本</text>
    <text x="14" y="118" class="desc">提取可调参数</text>
    <rect x="12" y="132" width="146" height="40" rx="6" fill="#fefce8" stroke="#fde68a"/>
    <text x="22" y="157" class="tag" fill="#b45309">Plot Skills 匹配</text>
  </g>

  <!-- 5. 受限 R 沙箱 -->
  <g transform="translate(860, 100)">
    <rect width="170" height="185" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#sh2)"/>
    <rect width="170" height="30" rx="10" fill="#f0fdf4"/>
    <rect y="20" width="170" height="10" fill="#f0fdf4"/>
    <text x="14" y="21" class="step-num" fill="#15803d">STEP 05</text>
    <text x="14" y="62" class="step-t">受限 R 沙箱</text>
    <text x="14" y="94" class="desc">renv 隔离，禁止外联</text>
    <text x="14" y="118" class="desc">读写与资源受限</text>
    <rect x="12" y="132" width="146" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="22" y="157" class="tag" fill="#15803d">报错自修 3 次</text>
  </g>

  <!-- 6. 不可变版本 -->
  <g transform="translate(1065, 100)">
    <rect width="175" height="185" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#sh2)"/>
    <rect width="175" height="30" rx="10" fill="#ecfdf5"/>
    <rect y="20" width="175" height="10" fill="#ecfdf5"/>
    <text x="14" y="21" class="step-num" fill="#047857">STEP 06</text>
    <text x="14" y="62" class="step-t">不可变图版本</text>
    <text x="14" y="94" class="desc">SVG / 300 DPI / R 源码</text>
    <text x="14" y="118" class="desc">写入版本血缘树</text>
    <rect x="12" y="132" width="151" height="40" rx="6" fill="#ecfdf5"/>
    <text x="22" y="157" class="tag" fill="#047857">推送至各界面</text>
  </g>

  <!-- 箭头连线 -->
  <path d="M 210 192 L 245 192" stroke="#2563eb" stroke-width="2" marker-end="url(#arr2)"/>
  <path d="M 415 192 L 450 192" stroke="#2563eb" stroke-width="2" marker-end="url(#arr2)"/>
  <path d="M 620 192 L 655 192" stroke="#2563eb" stroke-width="2" marker-end="url(#arr2)"/>
  <path d="M 825 192 L 860 192" stroke="#2563eb" stroke-width="2" marker-end="url(#arr2)"/>
  <path d="M 1030 192 L 1065 192" stroke="#059669" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- 底部提示 -->
  <g transform="translate(40, 320)">
    <rect width="1200" height="52" rx="8" fill="#fffaf5" stroke="#fed7aa" stroke-width="1.2"/>
    <text x="22" y="32" font-size="13" font-weight="700" fill="#ea580c">Report / Slides 文档指令</text>
    <text x="228" y="32" class="desc" font-size="13">排版与段落增删直接操作文档树，不进入绘图管线；图文复合指令才走上述 6 步</text>
  </g>
</svg>
